<html>
<head>
   <title>CSS Opacity Example</title>
   <style>
     .box1{
        background-color:red;
        opacity:1;		
	 }
	 .box2{
	    background-color:yellow;
        opacity:0.5;		
	 }
	 .box3{
        background-color:pink;
        opacity;0.2;		
	 }
	</style>
</head> 
<body>
  <div class="box1">
     Opacity 1
  </div>
  
  <div class="box2">
    Opacity 0.5
  </div>
  
  <div class="box3">
    Opacity 0.1
  </div>
</body>
</html>
